<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a32">
  <meta name="description" content="Study hub for the 37 bodhipakkhiyā dhammā in groups 8 7 5 5 4 4 4, with sutta pointers and interlinked phenomena.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="37 Dhammā">
  <title>Nama-Rūpa Explorer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/">
        <img src="./icons/icon.svg" alt="">
        <span class="brand-text">
          <strong>Nama-Rūpa Explorer</strong>
          <span>37 bodhipakkhiyā dhammā</span>
        </span>
      </a>
      <div class="search-wrap" id="desktop-search">
        <input id="global-search" type="search" placeholder="Search factors, suttas, phenomena" aria-label="Search">
      </div>
      <button class="icon-btn" id="search-toggle" type="button" aria-label="Search">⌕</button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme">◐</button>
    </header>
    <div id="mobile-search" class="search-wrap">
      <input id="mobile-search-input" type="search" placeholder="Search the 37 and related Dhamma" aria-label="Mobile search">
    </div>
    <div class="offline-banner">You are offline. Cached pages and catalog remain available.</div>
    <main id="app"></main>
  </div>
  <nav class="nav" aria-label="Primary">
    <a href="#/" data-nav="home">Hub</a>
    <a href="#/groups" data-nav="groups">Sets</a>
    <a href="#/threads" data-nav="threads">Links</a>
    <a href="#/phenomena" data-nav="phenomena">Phenomena</a>
    <a href="#/search" data-nav="search">Search</a>
  </nav>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
